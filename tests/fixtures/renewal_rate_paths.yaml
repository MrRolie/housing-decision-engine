# The opt-in renewal-rate path fixture (docs/specs/2026-10-01-renewal-rate-path-file.md §9).
#
# A house against rent on a 5-year term, a 25-year amortization and a 20-year
# horizon, so the file's four columns cover every renewal (years 6, 11, 16 and
# 21) and the last one is priced by nothing. The path file it reads,
# renewal_rate_paths_synthetic.json, is synthetic, not a calibration: twelve
# hand-set paths, quoted semi-annually, chosen so that the central row is not
# row 0. Every figure is illustrative. It is a FIXTURE, not an example.
years: 20
economic:
  mode: nominal
  inflation_rate: 0.021
house:
  initial_value: 550000
  down_payment: 110000
  mortgage_rate: 0.044
  mortgage_rate_compounding: effective_annual
  mortgage_term_years: 25
  mortgage_renewal_years: 5
  purchase_costs: 8200
  other_recurring_costs:
  - name: property_tax
    annual_amount: 4700
    escalation_rate: 0.021
  - name: home_insurance
    annual_amount: 1200
    escalation_rate: 0.021
  value_growth_rate: 0.031
  annual_maintenance_rate: 0.01
rent:
  monthly_rent: 1900
  rent_escalation_rate: 0.031
  invested_down_payment: 110000
  investment_return_rate: 0.051
simulation:
  num_sims: 2000
  random_seed: 42
  house_maintenance_vol: 0.3
  rent_escalation_vol: 0.01
renewal_rates:
  path: tests/fixtures/renewal_rate_paths_synthetic.json
sources:
  renewal_rates.path: user
