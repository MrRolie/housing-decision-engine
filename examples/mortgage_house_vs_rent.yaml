# Mortgage house vs rent — the leveraged path
# A financed house (20% down, 25-year amortization) against renting with the
# same down payment invested. Every earlier example is all-cash; this one
# exercises mortgage_pv and the outstanding balance inside terminal_equity_pv.
#
# --- Parameter provenance ---
# Sources (full table in examples/README.md "Parameter sources"):
#   FP Canada 2026 = Standards Council / Institute of Financial Planning,
#                    2026 Projection Assumption Guidelines (fpcanada.ca)
#   NAHB 2019      = "Operating Costs of Owning a Home" (2019 American Housing Survey)
#
#   Rates are typed AS QUOTED (the engine's default convention): in nominal mode the
#   engine uses each quoted figure as typed and the `rates:` line says so; the
#   anchored defaults stay real and are composed with inflation_rate.
#
#   economic.mode nominal ......... a mortgage is a NOMINAL contract: nominal mode keeps the payment
#                                   the lender actually collects (a real-rate level payment understates
#                                   year-1 cash and hides affordability breaches — the engine warns).
#   inflation_rate 0.021 .......... FP Canada 2026 PAG long-term inflation assumption — composed onto
#                                   the anchored real defaults (here the discount rate)
#   discount_rate (omitted) ....... engine default: 3% real (FP Canada 2026 PAG 60/40) composed with
#                                   inflation ⇒ 5.2% nominal, echoed under `defaults applied`
#   mortgage_rate 0.044 ........... FP Canada 2026 borrowing rate 4.4% nominal, used as an EFFECTIVE
#                                   ANNUAL rate with annual payments. A POSTED Canadian rate compounds
#                                   semi-annually — convert it first: r_eff = (1 + r_posted/2)^2 − 1.
#   down_payment 110000 ........... 20% of price — scenario-specific
#   mortgage_term_years 25 ........ common Canadian amortization — scenario-specific
#   value_growth_rate 0.031 ....... illustrative market view, 3.1% quoted ≈ 1.0% real — see the
#                                   showcase example for demographic drift
#   annual_maintenance_rate 0.01 .. NAHB 2019 Table 2 routine ≈ 0.6%/yr (narrow) + 1%-rule budgeting family
#   rent_escalation_rate 0.031 .... FP Canada 2026 shelter-cost growth, 3.1% as the PAG quotes it (≈ 1.0% real)
#   invested_down_payment 110000 .. like-for-like: the renter invests exactly the buyer's down payment
#   investment_return_rate 0.051 .. FP Canada 2026 PAG 60/40 ≈ 5.1% quoted (≈ 3.0% real)
#   *_vol ......................... illustrative uncertainty calibration — sensitivity-test via sweep
#
# Convention: "illustrative" = a calibration choice, not evidence — sensitivity-test it.

years: 20
# discount_rate omitted on purpose: the engine composes its 3% real default with inflation (5.2%)

economic:
  mode: nominal
  inflation_rate: 0.021  # FP Canada 2026 PAG long-term inflation

house:
  initial_value: 550000  # scenario-specific market input
  down_payment: 110000  # 20% — scenario-specific
  mortgage_rate: 0.044  # NOMINAL effective annual; FP Canada 2026 borrowing rate — a contract rate, used as entered in both modes
  mortgage_term_years: 25  # scenario-specific
  purchase_costs: 8200  # illustrative — a hand-typed welcome tax + notary; prefer land_transfer_tax: auto with a quoted province so the engine prices the duty (first_time_buyer_montreal.yaml)
  other_recurring_costs:
    - name: property_tax
      annual_amount: 4700  # illustrative — municipal + school tax ≈ 0.85% of value/yr; scenario-specific (use the listing's tax bill)
      escalation_rate: 0.021  # as quoted: rises with inflation ⇒ 0% real; tax tracks assessed value
    - name: home_insurance
      annual_amount: 1200  # illustrative — scenario-specific
      escalation_rate: 0.021  # as quoted: rises with inflation
  value_growth_rate: 0.031  # as quoted (used as typed in nominal mode; ≈ 1.0% real); illustrative market view
  annual_maintenance_rate: 0.01  # NAHB 2019 AHS Table 2 routine ≈ 0.6%/yr (narrow) + 1%-rule budgeting family

rent:
  monthly_rent: 2300  # scenario-specific market input
  rent_escalation_rate: 0.031  # as quoted; FP Canada 2026 shelter-cost growth 3.1% (≈ 1.0% real)
  invested_down_payment: 110000  # like-for-like with the buyer's down payment
  investment_return_rate: 0.051  # as quoted; FP Canada 2026 PAG 60/40 ≈ 5.1% (≈ 3.0% real)

simulation:
  num_sims: 5000
  random_seed: 42
  house_maintenance_vol: 0.30  # illustrative uncertainty calibration — sensitivity-test via sweep
  rent_escalation_vol: 0.01  # illustrative uncertainty calibration — sensitivity-test via sweep
