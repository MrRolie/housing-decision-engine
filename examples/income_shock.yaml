# Income shock scenario: 20% pay cut in year 3
# Which housing option is still affordable after the shock?
#
# --- Parameter provenance ---
# Sources (full table in examples/README.md "Parameter sources"):
#   FP Canada 2026 = Standards Council / Institute of Financial Planning,
#                    2026 Projection Assumption Guidelines (fpcanada.ca)
#   CMHC GDS/TDS   = CMHC "Calculating GDS/TDS" (cmhc-schl.gc.ca): GDS cap 39%, TDS 44%;
#                    legacy guideline 32%
#   NAHB 2019      = "Operating Costs of Owning a Home" (2019 American Housing Survey)
#   NBER/TAL       = NBER digest Oct 2025: continuing-tenant rents pass through ~21% of
#                    market-rent moves; QC TAL guideline ≈ CPI for existing leases
#
#   Rates are typed AS QUOTED (the engine's default convention). inflation_rate is
#   omitted, so the FP Canada 2.1% planning figure deflates them — the run echoes it
#   under `defaults applied` and the `rates:` line shows each figure in both forms.
#
#   discount_rate 0.072 .............. illustrative — the household's own time preference, 7.2% quoted
#                                      ≈ 5.0% real; sanity band [0.02, 0.06] real
#   fee_escalation_rate 0.052 ........ FP Canada 2026 shelter-cost growth 3.1% quoted ≈ 1.0% real
#                                      is the planning reference — 5.2% quoted ≈ 3% real is a
#                                      deliberate aggressive aging-building view
#   rent_escalation_rate 0.062 ....... FP Canada 2026 shelter 3.1% quoted ≈ 1.0% real planning
#                                      reference; NBER/TAL implies ≈ CPI (0.0% real) for continuing
#                                      tenants — 6.2% quoted ≈ 4% real is an aggressive market view,
#                                      justify it explicitly for your market
#   investment_return_rate 0.051 ..... FP Canada 2026 balanced 60/40 ≈ 5.1% quoted ≈ 3.0% real
#                                      (equities ≈ 4.2% real, upper bound ≈ 5.2%); the registry's
#                                      quoted form of the engine default — see src/hde/anchors.py
#   income_growth_rate 0.052 ......... FP Canada 2026 salary growth 3.1% quoted ≈ 1.0% real is the
#                                      planning reference — 5.2% quoted ≈ 3% real is an optimistic
#                                      career view
#   affordability_threshold 0.35 ..... CMHC GDS/TDS: 39% GDS cap / 44% TDS, legacy 32% guideline —
#                                      0.35 sits between legacy and GDS cap
#   pay_drop year 3 / magnitude 0.80 . illustrative scenario premise (the shock under study)
#   condo_fee_vol 0.08 ................ illustrative uncertainty calibration — sensitivity-test via sweep
#
# Convention: "illustrative" = a calibration choice, not evidence — sensitivity-test it.

years: 15
discount_rate: 0.072  # as quoted ≈ 5.0% real after 2.1% inflation; illustrative — the household's own time preference, sanity band [0.02, 0.06] real

condo:
  monthly_fee: 700  # scenario-specific market input
  fee_escalation_rate: 0.052  # as quoted ≈ 3% real; FP Canada 2026 shelter 3.1% quoted ≈ 1.0% real reference — aggressive aging-building view
  initial_value: 500000  # scenario-specific market input
  all_cash: true
  purchase_costs: 7500  # illustrative — Québec welcome tax (droits de mutation) + notary ≈ 1.5% of price; scenario-specific
  other_recurring_costs:
    - name: property_tax
      annual_amount: 3800  # illustrative — municipal + school tax ≈ 0.75% of value/yr; scenario-specific (use the listing's tax bill)
      escalation_rate: 0.021  # as quoted: rises with inflation ⇒ 0% real; tax tracks assessed value

rent:
  monthly_rent: 2500  # scenario-specific market input
  rent_escalation_rate: 0.062  # as quoted ≈ 4% real; FP Canada 2026 shelter 3.1% quoted + NBER/TAL ≈ CPI for continuing tenants — aggressive market view, justify for your market
  # Equalized with the condo's all-cash purchase capital (500k): a renter who
  # skips buying invests that same capital, so the opportunity cost is like-for-like.
  invested_down_payment: 500000
  investment_return_rate: 0.051  # as quoted ≈ 3.0% real; FP Canada 2026 balanced 60/40 (was 0.07 real — exceeded even the ≈5.2% real equity upper bound); the engine default's quoted form — see src/hde/anchors.py

income:
  annual_income: 120000  # scenario-specific input
  income_growth_rate: 0.052  # as quoted ≈ 3% real; FP Canada 2026 salary growth 3.1% quoted ≈ 1.0% real reference — optimistic career view
  affordability_threshold: 0.35  # CMHC GDS/TDS: between legacy 32% guideline and 39% GDS cap
  pay_drop_events:
    - year: 3  # illustrative scenario timing
      magnitude: 0.80  # illustrative shock size — the premise under study (20% pay cut)

simulation:
  num_sims: 5000
  random_seed: 42
  condo_fee_vol: 0.08  # illustrative uncertainty calibration — sensitivity-test via sweep

economic:
  mode: real
  # inflation_rate omitted on purpose: the FP Canada 2.1% planning figure deflates the
  # quoted rates above and is echoed under `defaults applied`
