# Basic Configuration Example
# A simple scenario for condo vs house cost comparison
#
# --- Parameter provenance ---
# Sources (full table in examples/README.md "Parameter sources"):
#   FP Canada 2026 = Standards Council / Institute of Financial Planning,
#                    2026 Projection Assumption Guidelines (fpcanada.ca)
#   NAHB 2019      = "Operating Costs of Owning a Home" (2019 American Housing Survey)
#
#   Rates are typed AS QUOTED (the engine's default convention) and converted once at
#   load; this file sets inflation_rate 0.0, so every quoted figure below IS its real
#   figure and the read-back's `rates:` line shows the two forms equal.
#
#   discount_rate 0.03 ............ illustrative — the household's own time preference; sanity band [0.02, 0.06]
#   inflation_rate 0.0 ............ the deflator of the quoted rates: 0 here means the figures
#                                   below are real figures already (kept explicit for pedagogy)
#   fee_escalation_rate 0.02 ...... FP Canada 2026 shelter-cost growth 3.1% quoted ≈ 1.0% real
#                                   is the planning reference — 2% real is a deliberate
#                                   aging-building view, above that reference
#   value_growth_rate 0.01 ........ illustrative market view — no defensible universal long-run
#                                   real appreciation default; for ISQ-grounded demographic drift
#                                   see market_scenario (showcase_demographic_prior.yaml)
#   annual_maintenance_rate 0.012 . NAHB 2019 (Table 2): routine maintenance ≈ 0.6% of value/yr (narrow AHS definition);
#                                   "1% rule" budgeting family (investopedia.com)
#   roof base_cost / timing ...... illustrative service lives/costs — calibrate to your reserve
#                                   study or component inventory
#   cost_vol / *_vol ............. illustrative uncertainty calibration — sensitivity-test via sweep
#
# Convention: "illustrative" = a calibration choice, not evidence — sensitivity-test it.

years: 20
discount_rate: 0.03  # as quoted (= real at 0% inflation); illustrative — the household's own time preference, sanity band [0.02, 0.06]

economic:
  mode: real
  inflation_rate: 0.0  # the deflator of every rate typed below: 0 leaves the quoted figures as real figures

condo:
  monthly_fee: 450  # scenario-specific market input
  fee_escalation_rate: 0.02  # as quoted (= real here); FP Canada 2026 shelter 3.1% quoted ≈ 1.0% real — above-reference aging-building view
  initial_value: 350000  # scenario-specific market input
  all_cash: true
  purchase_costs: 5200  # illustrative — Québec welcome tax (droits de mutation) + notary ≈ 1.5% of price; scenario-specific
  other_recurring_costs:
    - name: property_tax
      annual_amount: 2600  # illustrative — municipal + school tax ≈ 0.75% of value/yr; scenario-specific (use the listing's tax bill)
      escalation_rate: 0.0  # as quoted (= real here); tax tracks assessed value
  events: []

house:
  initial_value: 400000  # scenario-specific market input
  value_growth_rate: 0.01  # as quoted (= real here); illustrative market view — for demographic drift see showcase example
  annual_maintenance_rate: 0.012  # NAHB 2019 AHS Table 2 routine ≈ 0.6%/yr (narrow) + 1%-rule budgeting family
  all_cash: true
  purchase_costs: 6000  # illustrative — Québec welcome tax (droits de mutation) + notary ≈ 1.5% of price; scenario-specific
  other_recurring_costs:
    - name: property_tax
      annual_amount: 3400  # illustrative — municipal + school tax ≈ 0.85% of value/yr; scenario-specific (use the listing's tax bill)
      escalation_rate: 0.0  # as quoted (= real here); tax tracks assessed value
    - name: home_insurance
      annual_amount: 1200  # illustrative — scenario-specific
      escalation_rate: 0.0
  events:
    - name: "roof"
      base_cost: 10000  # illustrative service cost — calibrate to your component inventory
      expected_year: 20  # illustrative service life — calibrate to your reserve study
      timing_std_years: 3  # illustrative timing uncertainty
      cost_vol: 0.25  # illustrative uncertainty calibration — sensitivity-test via sweep

simulation:
  num_sims: 10000
  random_seed: 42
  house_maintenance_vol: 0.30  # illustrative uncertainty calibration — sensitivity-test via sweep
  condo_fee_vol: 0.05  # illustrative uncertainty calibration — sensitivity-test via sweep
