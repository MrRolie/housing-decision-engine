[project]
name = "demoflow"
version = "0.0.1"
description = "Demographic housing-flow scenario module (Québec RMR): fail-loud loaders, cohort roll-forward, excess-demand rankings, tripwires."
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "actuarial-system",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
demoflow = "demoflow.cli:main"

[tool.uv.sources]
# Operator ruling, 2026-08-24: the path dependency below resolves only inside the
# author's private stack. The public repo is published as-is — a cloner cannot install
# this dependency and that is accepted (a deliberate teaser, not an oversight). The
# engine's mortality surface is supplied by that package; see spec §2.
actuarial-system = { path = "../../actuarial-system" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demoflow"]
